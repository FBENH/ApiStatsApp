name: Deploy to Azure

# Publica la API en Azure App Service al mergear a main.
# Usa los secretos del entorno "prod": AZURE_WEBAPP_PUBLISH_PROFILE y, opcional, AZURE_WEBAPP_NAME
# (Settings > Environments > prod). Sin nombre, publica en statsappapi.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    env:
      APP: ${{ secrets.AZURE_WEBAPP_NAME || vars.AZURE_WEBAPP_NAME || 'statsappapi' }}
      PERFIL: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

    steps:
      - name: Check the publish profile
        if: env.PERFIL == ''
        run: |
          echo "::error::Falta el secreto AZURE_WEBAPP_PUBLISH_PROFILE."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish
        run: dotnet publish src/apiBask/apiBask.csproj --configuration Release --output publish

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP }}
          publish-profile: ${{ env.PERFIL }}
          package: publish
